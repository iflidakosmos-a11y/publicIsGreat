<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="我的一天">
  <meta name="theme-color" content="#f3f0fa">
  <title>我的一天</title>
  <link href="https://fonts.googleapis.com/css2?family=Noto+Serif+TC:wght@400;500;700&display=swap" rel="stylesheet">

  <style>
    :root {
      --bg:      #f3f0fa;
      --card:    #ffffff;
      --border:  #ddd5f0;
      --purple:  #7b1fa2;
      --purple-light: #ede7f6;
      --purple-border: #ce93d8;
      --text:    #2a0040;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }

    html, body {
      overflow-x: hidden;
      max-width: 100%;
    }

    body {
      background: var(--bg);
      font-family: 'Noto Serif TC', serif;
      color: var(--text);
      font-size: 16px;
      min-height: 100dvh;
      padding: max(env(safe-area-inset-top),28px) max(env(safe-area-inset-right),16px) max(env(safe-area-inset-bottom),40px) max(env(safe-area-inset-left),16px);
    }

    /* ── Top bar ── */
    .topbar {
      display: flex; align-items: center; justify-content: space-between;
      margin-bottom: 6px;
    }
    .app-label { font-size: 12px; letter-spacing: 0.12em; color: var(--purple); font-weight: 500; }
    .reset-btn {
      background: none; border: 1.5px solid var(--purple-border);
      color: var(--purple); border-radius: 99px; padding: 5px 14px;
      font-size: 12px; font-family: 'Noto Serif TC', serif; cursor: pointer;
    }
    .reset-btn:active { background: var(--purple-light); }

    /* ── Date nav ── */
    .date-nav { display: flex; align-items: center; gap: 8px; margin-bottom: 24px; }
    .nav-btn {
      width: 36px; height: 36px; border-radius: 50%;
      border: 1.5px solid var(--purple-border); background: var(--card);
      color: var(--purple); font-size: 20px; cursor: pointer;
      display: flex; align-items: center; justify-content: center; flex-shrink: 0;
    }
    .nav-btn:active { background: var(--purple-light); }
    .nav-btn:disabled { opacity: 0.25; cursor: default; }
    .date-center { flex: 1; text-align: center; }
    .date-big {
      font-family: 'Noto Serif TC', serif;
      font-size: 24px; font-weight: 700; color: var(--text); display: block;
    }
    .date-tag {
      display: inline-block; margin-top: 4px; font-size: 11px;
      color: var(--purple); background: var(--purple-light);
      border-radius: 99px; padding: 2px 12px; letter-spacing: 0.06em;
    }

    /* ── Card ── */
    .card {
      border-radius: 20px; border: 1.5px solid var(--border);
      margin-bottom: 16px; overflow: hidden; background: var(--card);
      box-shadow: 0 2px 12px rgba(123,31,162,0.07);
    }
    .card-head {
      padding: 12px 16px 10px;
      border-bottom: 1.5px solid var(--border);
      font-size: 16px; font-weight: 700;
      color: var(--purple); background: var(--purple-light);
    }
    /* ── Two-column bag card ── */
    .card.bag { border-color: #d6c8ee; }
    .bag-cols {
      display: flex;
      align-items: stretch;
    }
    .bag-col {
      flex: 0 0 50%;
      width: 50%;
      min-width: 0;
      display: flex;
      flex-direction: column;
    }
    .bag-col:first-child {
      border-right: 1.5px solid #d6c8ee;
    }
    .bag-col-head {
      padding: 12px 16px 10px;
      font-size: 16px; font-weight: 700;
      color: var(--purple); background: #ede8f7;
      border-bottom: 1.5px solid #d6c8ee;
    }
    .bag-col .item-list { flex: 1; }
    .bag-col .item-row { padding: 11px 16px; }
    .bag-col .add-row { padding: 8px 16px 12px; }
    .bag-col .add-input { font-size: 16px; padding: 8px 10px; }
    .bag-col .add-btn { width: 38px; height: 38px; min-width: 38px; font-size: 22px; }

    /* ── Two-column meal card ── */
    .meal-cols {
      display: flex;
      align-items: stretch;
    }
    .meal-col {
      flex: 0 0 50%;
      width: 50%;
      min-width: 0;
      display: flex;
      flex-direction: column;
    }
    .meal-col:first-child { border-right: 1.5px solid var(--border); }
    .meal-col-head {
      padding: 12px 16px 10px;
      font-size: 16px; font-weight: 700;
      color: var(--purple); background: var(--purple-light);
      border-bottom: 1.5px solid var(--border);
    }
    .meal-col .item-list { flex: 1; }
    .meal-col .item-row { padding: 11px 14px; border-bottom-color: #f0ebfa; }
    .meal-col .add-row { padding: 8px 14px 12px; }
    .meal-col .add-input { font-size: 16px; padding: 8px 10px; }
    .meal-col .add-btn { width: 38px; height: 38px; min-width: 38px; font-size: 22px; }
    .item-list { padding: 0; }
    .item-row {
      display: flex; align-items: center; gap: 12px;
      padding: 13px 20px;
      border-bottom: 1px solid #f0ebfa;
    }
    .item-row:last-child { border-bottom: none; }

    /* Checkbox */
    .cb {
      width: 24px; height: 24px;
      border: 2px solid var(--purple-border); border-radius: 7px;
      background: #fff; flex-shrink: 0; cursor: pointer;
      appearance: none; -webkit-appearance: none;
      position: relative; transition: all 0.15s;
    }
    .cb:checked { background: var(--purple); border-color: var(--purple); }
    .cb:checked::after {
      content: ''; position: absolute;
      left: 6px; top: 3px; width: 6px; height: 10px;
      border: 2.5px solid #fff; border-top: none; border-left: none;
      transform: rotate(45deg);
    }

    .item-text {
      flex: 1; font-size: 16px; color: var(--text); word-break: break-all;
    }
    .item-row.done .item-text { text-decoration: line-through; color: var(--purple-border); }

    .del-btn {
      background: none; border: none; color: var(--purple-border);
      font-size: 22px; line-height: 1; cursor: pointer; padding: 0 2px; flex-shrink: 0;
    }
    .del-btn:active { color: #a0306a; }

    /* ── Add row ── */
    .add-row {
      display: flex; flex-direction: row; align-items: center;
      gap: 8px; padding: 10px 20px 14px;
      border-top: 1px dashed var(--border);
    }
    .add-label {
      font-size: 16px; color: var(--text); white-space: nowrap; flex-shrink: 0;
    }
    .add-input {
      flex: 1 1 0; min-width: 0;
      border: 1.5px solid var(--border); border-radius: 10px;
      padding: 10px 14px; font-size: 16px;
      font-family: 'Noto Serif TC', serif; color: var(--text);
      background: var(--bg); outline: none; -webkit-appearance: none;
      transition: border-color 0.2s;
    }
    .add-input:focus { border-color: var(--purple); }
    .add-btn {
      width: 44px; height: 44px; min-width: 44px;
      background: var(--purple); border: none; border-radius: 10px;
      color: #fff; font-size: 26px; font-weight: 300; cursor: pointer;
      flex-shrink: 0; display: flex; align-items: center; justify-content: center;
      line-height: 1; -webkit-appearance: none; transition: opacity 0.12s, transform 0.12s;
    }
    .add-btn:active { opacity: 0.75; transform: scale(0.88); }

    /* ── Past mode ── */
    .past-banner {
      display: none; text-align: center; font-size: 13px;
      color: var(--purple); background: var(--purple-light);
      border: 1px solid var(--purple-border); border-radius: 10px;
      padding: 8px 16px; margin-bottom: 16px;
    }
    body.past-mode .past-banner { display: block; }
    body.past-mode .add-row { display: none; }

    .footer { text-align: center; font-size: 12px; color: var(--purple-border); margin-top: 10px; }
  </style>
</head>
<body>

<div class="topbar">
  <span class="app-label">我的一天</span>
  <button class="reset-btn" onclick="resetDay()">清空這天</button>
</div>

<div class="date-nav">
  <button class="nav-btn" id="prevBtn" onclick="changeDay(-1)">‹</button>
  <div class="date-center">
    <span class="date-big" id="dateDisplay"></span>
    <span class="date-tag" id="dateTag">今天</span>
  </div>
  <button class="nav-btn" id="nextBtn" onclick="changeDay(1)">›</button>
</div>

<div class="past-banner">📅 查看模式 — 過去的紀錄無法編輯</div>

<!-- 帶去公司 ＋ 採買 -->
<div class="card bag">
  <div class="bag-cols">
    <div class="bag-col">
      <div class="bag-col-head">帶去公司</div>
      <div class="item-list" id="list-bag"></div>
      <div class="add-row">
        <input class="add-input" id="input-bag" placeholder="新增…" type="text">
        <button class="add-btn" onclick="addItem('bag')">+</button>
      </div>
    </div>
    <div class="bag-col">
      <div class="bag-col-head">採買</div>
      <div class="item-list" id="list-shop"></div>
      <div class="add-row">
        <input class="add-input" id="input-shop" placeholder="新增…" type="text">
        <button class="add-btn" onclick="addItem('shop')">+</button>
      </div>
    </div>
  </div>
</div>

<!-- 早餐 -->
<div class="card">
  <div class="card-head">早餐</div>
  <div class="meal-cols">
    <div class="meal-col">
      <div class="meal-col-head">預先準備</div>
      <div class="item-list" id="list-bfast-prep"></div>
      <div class="add-row">
        <input class="add-input" id="input-bfast-prep" placeholder="新增…" type="text">
        <button class="add-btn" onclick="addItem('bfast-prep')">+</button>
      </div>
    </div>
    <div class="meal-col">
      <div class="meal-col-head">餐點</div>
      <div class="item-list" id="list-bfast"></div>
      <div class="add-row">
        <input class="add-input" id="input-bfast" placeholder="新增…" type="text">
        <button class="add-btn" onclick="addItem('bfast')">+</button>
      </div>
    </div>
  </div>
</div>

<!-- 午餐 -->
<div class="card">
  <div class="card-head">午餐</div>
  <div class="meal-cols">
    <div class="meal-col">
      <div class="meal-col-head">預先準備</div>
      <div class="item-list" id="list-lunch-prep"></div>
      <div class="add-row">
        <input class="add-input" id="input-lunch-prep" placeholder="新增…" type="text">
        <button class="add-btn" onclick="addItem('lunch-prep')">+</button>
      </div>
    </div>
    <div class="meal-col">
      <div class="meal-col-head">餐點</div>
      <div class="item-list" id="list-lunch"></div>
      <div class="add-row">
        <input class="add-input" id="input-lunch" placeholder="新增…" type="text">
        <button class="add-btn" onclick="addItem('lunch')">+</button>
      </div>
    </div>
  </div>
</div>

<!-- 晚餐 -->
<div class="card">
  <div class="card-head">晚餐</div>
  <div class="meal-cols">
    <div class="meal-col">
      <div class="meal-col-head">預先準備</div>
      <div class="item-list" id="list-dinner-prep"></div>
      <div class="add-row">
        <input class="add-input" id="input-dinner-prep" placeholder="新增…" type="text">
        <button class="add-btn" onclick="addItem('dinner-prep')">+</button>
      </div>
    </div>
    <div class="meal-col">
      <div class="meal-col-head">餐點</div>
      <div class="item-list" id="list-dinner"></div>
      <div class="add-row">
        <input class="add-input" id="input-dinner" placeholder="新增…" type="text">
        <button class="add-btn" onclick="addItem('dinner')">+</button>
      </div>
    </div>
  </div>
</div>

<div class="footer" id="footer">Safari → 分享 → 加入主畫面，即可釘選</div>

<script>
  var KEYS      = ['bag','shop','bfast-prep','bfast','lunch-prep','lunch','dinner-prep','dinner'];
  var MEAL_KEYS = ['bfast-prep','bfast','lunch-prep','lunch','dinner-prep','dinner'];
  var PREFIX    = 'myDay_v5_';
  var dayOffset = 0;

  function pad(n) { return n<10?'0'+n:''+n; }
  function dateKey(offset) {
    var d=new Date(); d.setDate(d.getDate()+(offset||0));
    return d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate());
  }
  function getStore(dk) {
    try { var r=localStorage.getItem(PREFIX+dk); return r?JSON.parse(r):{}; } catch(e){return{};}
  }
  function setStore(dk,obj) {
    try { localStorage.setItem(PREFIX+dk,JSON.stringify(obj)); } catch(e){}
  }
  function getItems(key) {
    var dk=(key==='bag'||key==='shop')?key:dateKey(dayOffset);
    return getStore(dk)[key]||[];
  }
  function setItems(key,arr) {
    var dk=(key==='bag'||key==='shop')?key:dateKey(dayOffset);
    var s=getStore(dk); s[key]=arr; setStore(dk,s);
  }

  function renderDate() {
    var d=new Date(); d.setDate(d.getDate()+dayOffset);
    var days=['日','一','二','三','四','五','六'];
    document.getElementById('dateDisplay').textContent=(d.getMonth()+1)+'月'+d.getDate()+'日（'+days[d.getDay()]+'）';
    var labels={0:'今天','-1':'昨天',1:'明天'};
    document.getElementById('dateTag').textContent=labels[dayOffset]||(dayOffset<0?Math.abs(dayOffset)+' 天前':'+'+dayOffset+' 天後');
    document.body.classList.toggle('past-mode',dayOffset<0);
    document.getElementById('prevBtn').disabled=dayOffset<=-7;
    document.getElementById('nextBtn').disabled=dayOffset>=7;
  }

  function renderList(key) {
    var el=document.getElementById('list-'+key);
    if(!el) return;
    el.innerHTML='';
    var items=getItems(key);
    for(var i=0;i<items.length;i++){
      (function(idx){
        var item=items[idx];
        var row=document.createElement('div');
        row.className='item-row'+(item.checked?' done':'');

        var cb=document.createElement('input');
        cb.type='checkbox'; cb.className='cb'; cb.checked=!!item.checked;
        cb.onchange=function(){
          var arr=getItems(key); arr[idx].checked=cb.checked; setItems(key,arr);
          row.className='item-row'+(cb.checked?' done':'');
        };

        var txt=document.createElement('div');
        txt.className='item-text'; txt.textContent=item.text;

        var del=document.createElement('button');
        del.className='del-btn'; del.textContent='×';
        del.onclick=function(){ var arr=getItems(key); arr.splice(idx,1); setItems(key,arr); renderList(key); };

        row.appendChild(cb); row.appendChild(txt); row.appendChild(del);
        el.appendChild(row);
      })(i);
    }
  }

  function addItem(key) {
    if(dayOffset<0) return;
    var input=document.getElementById('input-'+key);
    if(!input) return;
    var text=input.value.trim();
    if(!text) return;
    var arr=getItems(key);
    arr.push({text:text,checked:false});
    setItems(key,arr);
    renderList(key);
    input.value='';
    input.blur();
    setTimeout(function(){
      document.documentElement.scrollLeft = 0;
      document.body.scrollLeft = 0;
      window.scrollTo(0, window.scrollY);
    }, 100);
  }

  function changeDay(d) {
    var n=dayOffset+d;
    if(n<-7||n>7) return;
    dayOffset=n; renderAll();
  }

  function resetDay() {
    if(!confirm('確定清空這天的三餐紀錄？\n帶去公司清單不受影響。')) return;
    var dk=dateKey(dayOffset), s=getStore(dk);
    MEAL_KEYS.forEach(function(k){s[k]=[];}); setStore(dk,s);
    MEAL_KEYS.forEach(function(k){renderList(k);});
  }

  function renderAll() {
    renderDate();
    KEYS.forEach(function(k){renderList(k);});
  }

  window.addEventListener('load',function(){
    KEYS.forEach(function(k){
      var inp=document.getElementById('input-'+k);
      if(inp) inp.addEventListener('keydown',function(e){ if(e.key==='Enter') addItem(k); });
    });
  });

  renderAll();
  if(window.navigator.standalone) document.getElementById('footer').style.display='none';
</script>
</body>
</html>
